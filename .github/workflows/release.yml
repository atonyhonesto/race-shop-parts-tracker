# Windows installer for the desktop app, published to GitHub Releases when a version tag is pushed.
# Cut a release with `pnpm release` on main, then `git push origin main --follow-tags`.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build and publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the build provenance attestation
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      # Baked into the app at build time. Repository variables (Settings → Variables), not secrets:
      # none of these values are confidential (docs/auth/entra-setup.md).
      VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
      VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      VITE_ENTRA_DESKTOP_CLIENT_ID: ${{ vars.ENTRA_DESKTOP_CLIENT_ID }}
      VITE_API_SCOPE: ${{ vars.API_SCOPE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version and the build settings are present
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG does not match apps/desktop version $version."; exit 1; }
          for name in VITE_API_BASE_URL VITE_ENTRA_TENANT_ID VITE_ENTRA_DESKTOP_CLIENT_ID VITE_API_SCOPE; do
            [ -n "${!name}" ] || { echo "::error::Repository variable for $name is not set (see CONTRIBUTING.md, Releases)."; exit 1; }
          done

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raceshop/desktop... build

      - name: Package the NSIS installer
        run: pnpm --filter @raceshop/desktop package

      - name: Checksums
        working-directory: apps/desktop/release
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Signed statement of which workflow and commit built the installer (verifiable with `gh attestation verify`).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/desktop/release/*.exe

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs --notes "$TAG" > release-notes.md
          gh release create "$TAG" \
            --title "Race Shop Parts Tracker $TAG" \
            --notes-file release-notes.md \
            apps/desktop/release/*.exe apps/desktop/release/SHA256SUMS.txt
