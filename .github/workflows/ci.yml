# Quality gates for every pull request and every push to main.
# Fails on: formatting drift, analyzer or lint warnings, type errors, failing tests,
# or commit messages that are not Conventional Commits.
# Actions are pinned to full commit SHAs (tags can be moved); the comment shows the version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - name: Restore (lock files must match)
        run: dotnet restore api/RaceShop.slnx --locked-mode

      - name: Check formatting and code style
        run: dotnet format api/RaceShop.slnx --verify-no-changes --no-restore

      - name: Build (analyzer warnings are errors)
        run: dotnet build api/RaceShop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution api/RaceShop.slnx --configuration Release --no-build

  typescript:
    name: Front end build, lint, test, budget, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

      # Build first: apps type-check and lint against the built ui-wc and api-client packages.
      # The web build is the production one (Entra sign-in), which the budget below measures.
      - run: pnpm build

      - name: Generated API client matches openapi.json
        run: |
          pnpm --filter @raceshop/api-client generate
          git diff --exit-code -- packages/api-client/src/generated \
            || { echo "::error::Generated client is stale. Run 'pnpm api:contract' and commit."; exit 1; }

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Bundle-size budget (and no dev sign-in in the production build)
        run: pnpm bundle:check

      - name: Accessibility of every Storybook story (axe, WCAG 2.2 AA)
        run: |
          pnpm --filter @raceshop/storybook exec playwright install --with-deps chromium
          pnpm --filter @raceshop/storybook test:a11y

  e2e:
    name: End-to-end smoke (API + SQL Server + web + desktop, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raceshop/ui-wc --filter @raceshop/api-client build
      - run: pnpm --filter @raceshop/web exec playwright install --with-deps chromium

      # A throwaway SQL Server with a password generated for this run only (masked in logs),
      # so no credential lives in the repository, not even a test one.
      - name: Start SQL Server
        run: |
          password="E2e-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$password"
          docker run -d --name sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q "SELECT 1" -b >/dev/null 2>&1 && break
            sleep 3
          done
          echo "E2E_CONNECTION_STRING=Server=127.0.0.1,1433;Database=RaceShopE2E;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - run: pnpm --filter @raceshop/web e2e

      # The Electron app: same screens, API calls proxied by the main process, offline mode.
      # Electron 45 downloads its binary explicitly (checksum-verified), not in an install script.
      - name: Desktop app (Electron) smoke test
        run: |
          pnpm --filter @raceshop/desktop exec install-electron
          pnpm --filter @raceshop/desktop build:dev
          xvfb-run --auto-servernum pnpm --filter @raceshop/desktop e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            apps/desktop/playwright-report
          retention-days: 7

  # Compiles the Bicep and its parameter file and runs the linter (bicepconfig.json makes the
  # important rules errors). Needs no Azure login: nothing is deployed from pull requests.
  infrastructure:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders so main.bicepparam compiles; real values come from the production environment.
      SQL_ADMIN_GROUP_NAME: raceshop-sql-admins
      SQL_ADMIN_GROUP_OBJECT_ID: 00000000-0000-0000-0000-000000000001
      ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000002
      BUDGET_EMAIL: ci@example.com
      BUDGET_START_DATE: '2026-11-01'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: az bicep install
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Event data goes through env, not inline ${{ }} in the script (prevents script injection).
      - name: Check every commit in the pull request
        run: node scripts/lint-commit-msg.mjs --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Single required check for branch protection, so adding or renaming jobs
  # does not mean editing the repository settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [dotnet, typescript, e2e, infrastructure, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
