# Quality gates for every pull request and every push to main.
# Fails on: formatting drift, analyzer or lint warnings, type errors, failing tests,
# or commit messages that are not Conventional Commits.
# Actions are pinned to full commit SHAs (tags can be moved); the comment shows the version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - name: Restore (lock files must match)
        run: dotnet restore api/RaceShop.slnx --locked-mode

      - name: Check formatting and code style
        run: dotnet format api/RaceShop.slnx --verify-no-changes --no-restore

      - name: Build (analyzer warnings are errors)
        run: dotnet build api/RaceShop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution api/RaceShop.slnx --configuration Release --no-build

  typescript:
    name: TypeScript format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Event data goes through env, not inline ${{ }} in the script (prevents script injection).
      - name: Check every commit in the pull request
        run: node scripts/lint-commit-msg.mjs --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Single required check for branch protection, so adding or renaming jobs
  # does not mean editing the repository settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [dotnet, typescript, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
