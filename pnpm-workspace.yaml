packages:
  - packages/*
  - apps/*

# Fail installs on the wrong Node version instead of warning.
engineStrict: true

# Supply chain: do not install a package version until it has been public for 3 days
# (most malicious releases are caught and pulled within hours).
minimumReleaseAge: 4320

# Dependency install scripts are blocked by default; each one is decided here explicitly.
allowBuilds:
  # Its postinstall only re-checks the platform binary, which comes from @esbuild/<platform>.
  esbuild: false
  # Squirrel.Windows tooling that electron-builder pulls in; we build NSIS installers, not Squirrel.
  electron-winstaller: false
